name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set build output directory
        run: echo "ALTIRO_BUILD_ROOT=$RUNNER_TEMP/altiro-build" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;30.0.16248370' 'cmake;4.1.2'

      - name: Install host Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y glslc=2023.8-1build1

      - name: Verify apps and compile device tests
        run: ./scripts/quiet-run.sh "verification" ./scripts/verify.sh

      - name: Check whitespace
        run: git diff-tree --check --root HEAD

      - name: Retain debug APKs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-build
          path: |
            ${{ runner.temp }}/altiro-build/**/outputs/apk/**/*.apk
            ${{ runner.temp }}/altiro-build/**/reports/
            ${{ runner.temp }}/altiro-build/**/test-results/
          retention-days: 7

  device-tests:
    name: device-tests (${{ matrix.api-level }}, ${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: '33'
            target: google_apis
            ram: 2048M
          - api-level: '37.0'
            target: google_apis
            ram: 4096M
          - api-level: '37.0'
            target: google_apis_ps16k
            ram: 4096M
    timeout-minutes: 30
    steps:
      - name: Set build output directory
        run: echo "ALTIRO_BUILD_ROOT=$RUNNER_TEMP/altiro-build" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;30.0.16248370' 'cmake;4.1.2'
      - name: Install host Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y glslc=2023.8-1build1
      - name: Enable runner KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Run framework, startup, native and fixture tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: ${{ matrix.ram }}
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest :editor-fixture:connectedDebugAndroidTest
      - name: Retain device-test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emulator-tests-api-${{ matrix.api-level }}-${{ matrix.target }}
          path: ${{ runner.temp }}/altiro-build/**/reports/androidTests/
          retention-days: 7

  emulator:
    name: emulator
    if: ${{ always() }}
    needs: device-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all device-test configurations to pass
        env:
          DEVICE_TEST_RESULT: ${{ needs.device-tests.result }}
        run: test "$DEVICE_TEST_RESULT" = success
