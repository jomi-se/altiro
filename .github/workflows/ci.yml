name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALTIRO_BUILD_ROOT: ${{ runner.temp }}/altiro-build
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Verify apps and compile device tests
        run: ./scripts/quiet-run.sh "verification" ./scripts/verify.sh

      - name: Check whitespace
        run: git diff-tree --check --root HEAD

      - name: Retain debug APKs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-build
          path: |
            ${{ runner.temp }}/altiro-build/**/outputs/apk/**/*.apk
            ${{ runner.temp }}/altiro-build/**/reports/
            ${{ runner.temp }}/altiro-build/**/test-results/
          retention-days: 7

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALTIRO_BUILD_ROOT: ${{ runner.temp }}/altiro-build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable runner KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Run API 33 fixture and password tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest :editor-fixture:connectedDebugAndroidTest
      - name: Retain device-test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emulator-tests
          path: ${{ runner.temp }}/altiro-build/**/reports/androidTests/
          retention-days: 7
